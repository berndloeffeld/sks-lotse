version: 2
updates:
  # Backend dependencies are pinned exactly (backend/requirements*.txt), so
  # nothing moves on its own — Dependabot proposes the bumps as PRs, which then
  # go through the normal CI + Aikido check before merging.
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
