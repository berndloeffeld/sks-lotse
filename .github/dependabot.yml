version: 2
updates:
  # Backend dependencies are declared in backend/requirements*.in and locked with
  # hashes in the pip-compile output backend/requirements*.txt (README → Dependencies),
  # so nothing moves on its own — Dependabot proposes the bumps as PRs (regenerating
  # the locks), which then go through the normal CI (and the by-hand Aikido check).
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    # A release is only proposed once it has been out for a few days — most malicious or broken
    # releases are yanked within that window. Security updates are not delayed by this.
    cooldown:
      default-days: 5
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    # Vitest stays on 4.x until @stryker-mutator/vitest-runner supports Vitest 5
    # (stryker-js#6210, ADR-0035); a bump would silently zero the mutation score.
    ignore:
      - dependency-name: vitest
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/coverage-v8"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 5
    # One PR for all actions: with strict branch protection every merge makes the next open PR
    # stale (update-branch + a full CI run), so fewer, grouped PRs are cheaper.
    groups:
      github-actions:
        patterns: ["*"]

  # Keeps the pre-commit hook revisions (e.g. ruff) from drifting away from
  # the pinned versions in backend/requirements-dev.in.
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 5
    groups:
      pre-commit-hooks:
        patterns: ["*"]
