version: 2
updates:
  # Backend dependencies are pinned exactly (backend/requirements*.txt), so
  # nothing moves on its own — Dependabot proposes the bumps as PRs, which then
  # go through the normal CI (and the by-hand Aikido check) before merging.
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Keeps the pre-commit hook revisions (e.g. ruff) from drifting away from
  # the pinned versions in backend/requirements-dev.txt.
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
