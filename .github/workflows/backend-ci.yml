name: Backend CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege for the default GITHUB_TOKEN: no job here writes to the repo.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Tests override get_db (in-memory SQLite), so this never needs to be a
      # real, reachable database — it only has to satisfy Settings() on import.
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      # JWT_SECRET has no default (see backend/app/core/config.py) — any
      # fixed value is fine here since ENVIRONMENT stays "development". Not a
      # real secret, just `openssl rand -hex 32` output — long enough that it
      # wouldn't itself trip the production min-length check if ever copied
      # somewhere it shouldn't be, unlike an obviously-named placeholder.
      JWT_SECRET: 45eb335498028f51fca3594cd2979ac9e9a3f9f09a908ccee3b05f054e7964ac
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: pip install -r requirements-dev.txt
      - run: PYTHONPATH=. pytest

  migrations:
    # The pytest suite runs on in-memory SQLite, so it never executes the
    # Alembic migrations or touches Postgres. This job does: upgrade to head,
    # fail if the models have drifted from the migrations (alembic check),
    # and prove every downgrade path works too.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      JWT_SECRET: 45eb335498028f51fca3594cd2979ac9e9a3f9f09a908ccee3b05f054e7964ac
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: pip install -r requirements.txt
      - run: alembic upgrade head
      - run: alembic check
      - run: alembic downgrade base
      - run: alembic upgrade head

  postman-collection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: pip install -r backend/requirements.txt
      - run: ./scripts/generate_postman_collection.sh
      - run: git diff --exit-code postman/
        name: Fail if the committed collection is out of date (run scripts/generate_postman_collection.sh and commit the result)
