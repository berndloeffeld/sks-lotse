name: Backend CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Tests override get_db (in-memory SQLite), so this never needs to be a
      # real, reachable database — it only has to satisfy Settings() on import.
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      # JWT_SECRET has no default (see backend/app/core/config.py) — any
      # fixed value is fine here since ENVIRONMENT stays "development".
      JWT_SECRET: test-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: PYTHONPATH=. pytest

  postman-collection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r backend/requirements.txt
      - run: ./scripts/generate_postman_collection.sh
      - run: git diff --exit-code postman/
        name: Fail if the committed collection is out of date (run scripts/generate_postman_collection.sh and commit the result)
