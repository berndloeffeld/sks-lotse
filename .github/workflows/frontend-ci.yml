name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege for the default GITHUB_TOKEN: no job here writes to the repo.
permissions:
  contents: read

# One run per branch/PR: a new push (or `gh pr update-branch`, which strict branch protection
# needs after every merge) cancels the now-outdated run instead of queueing behind it. Runs for
# pushes to main are never cancelled: every commit there gets a complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      # Known high/critical vulnerabilities in what ships to the browser (dev tooling excluded).
      - run: npm audit --omit=dev --audit-level=high
      # The same build Render runs (tsc, client + SSR build, prerender.mjs): a broken prerender
      # must fail here, not in the deploy. It sits in this job rather than frontend-test, which the
      # tests already make the longer one, so the two run side by side.
      - run: npm run build
      # SBF Lotse, the second site from this frontend (ADR-0067): its build, and that it carries no
      # API client and none of SKS Lotse's data — with VITE_SBF "off" (what render.yaml deploys today)
      # no Navigationsaufgaben either, with "on" all of them (ADR-0068). Steps here rather than jobs of
      # their own, so the required checks stay as they are.
      - run: npm run build && node scripts/check-sbf-build.mjs
        env:
          VITE_SITE: sbf
          VITE_SBF: 'off'
      - run: npm run build && node scripts/check-sbf-build.mjs
        env:
          VITE_SITE: sbf
          VITE_SBF: 'on'

  frontend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npx vitest run --coverage
