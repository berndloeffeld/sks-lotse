name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege for the default GITHUB_TOKEN: no job here writes to the repo.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npx vitest run --coverage

  mutation-testing:
    # Do the tests notice a bug, not just execute the line? Stryker changes the logic modules
    # (frontend/stryker.config.json) one small step at a time and the job fails if fewer than
    # MUTATION_MIN_SCORE (90%, scripts/run_frontend_mutation_tests.sh) of those changes are caught,
    # or if the runner is broken (mutants that ran no tests). Scope, survivors and the Vitest 4
    # pin: docs/mutation-testing.md. Not a required check (~3 min) — look at it before merging.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: ./scripts/run_frontend_mutation_tests.sh gate
