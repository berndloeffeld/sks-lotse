name: Mutation testing

# Do the tests notice a bug, not just execute the line? mutmut (backend) and Stryker (frontend)
# change the business-logic modules one small step at a time; a job fails if fewer than its
# minimum score of those changes are caught (scripts/run_mutation_tests.sh: 87%,
# scripts/run_frontend_mutation_tests.sh: 90%). Scope, survivors and how to work on them:
# docs/mutation-testing.md. Weekly instead of per PR (~5 min / ~3 min, not a required check);
# a failed run opens an issue, and GitHub also mails the person who last edited the cron line.
# Scheduled runs only fire from the default branch, and GitHub pauses them after 60 days
# without repo activity. "Run workflow" in the Actions tab starts one on demand.

on:
  schedule:
    - cron: "0 3 * * 1" # Mondays, 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - run: pip install -r backend/requirements-mutation.txt
      - run: ./scripts/run_mutation_tests.sh gate

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: ./scripts/run_frontend_mutation_tests.sh gate

  alert:
    # One open issue at a time: a second failing week adds a comment instead of another issue.
    needs: [backend, frontend]
    if: ${{ always() && (needs.backend.result == 'failure' || needs.frontend.result == 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - run: |
          title="Mutation testing failed"
          body="The weekly mutation-testing run failed: $RUN_URL. Survivors are listed in the job log; see docs/mutation-testing.md."
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
