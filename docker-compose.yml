services:
  db:
    image: postgres:18
    container_name: sks-lotse-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sks_lotse
      POSTGRES_USER: sks_lotse
      POSTGRES_PASSWORD: sks_lotse
    ports:
      # Loopback only — the default credentials above must not be reachable
      # from the local network.
      - "127.0.0.1:5432:5432"
    volumes:
      # Postgres 18+ images keep their data under a version subdirectory of /var/lib/postgresql
      # and refuse to start with a mount at the old .../data path. A new volume name, because an
      # existing Postgres 16 data directory can't be opened by 18 (the old volume stays untouched;
      # `docker volume rm sks-lotse-db-data` once it's no longer needed).
      - sks-lotse-db-data-18:/var/lib/postgresql

volumes:
  sks-lotse-db-data-18:
