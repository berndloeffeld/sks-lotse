# Local guardrails that catch problems before a push — GitHub's branch
# protection on main enforces the same rules server-side (see CLAUDE.md →
# Branch Strategy / Development Conventions).
# One-time setup: `pip install -r backend/requirements-dev.txt && (cd frontend && npm install) && pre-commit install --install-hooks -t pre-commit -t pre-push`
# The type checks (mypy, tsc) run on `git push` rather than on every commit — they check the whole
# project and take a few seconds each, same as the `backend-lint`/`frontend-test` CI jobs they mirror.
# Hooks without their own `stages` run on commit only; the slower type checks opt into pre-push.
default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Trunk-based: every change goes through a feature branch + PR.
      - id: no-commit-to-branch
        args: [--branch, main]
      - id: check-merge-conflict
      - id: check-yaml
        # render.yaml and the workflows use plain YAML; the flag only relaxes custom tags.
        args: [--unsafe]
      - id: check-json
        # tsconfig files are JSONC (comments allowed); tsc itself checks them.
        exclude: ^frontend/tsconfig.*\.json$
      - id: check-added-large-files
        # The catalog PDF and images live in the repo on purpose; this catches accidental dumps.
        args: [--maxkb=2048]
      - id: detect-private-key
      - id: end-of-file-fixer
        exclude: ^postman/sks-lotse\.postman_collection\.json$
      - id: trailing-whitespace
        exclude: ^postman/sks-lotse\.postman_collection\.json$

  # Local hooks (not mirror repos like ruff-pre-commit) so ruff, eslint and prettier run in the
  # versions backend/requirements-dev.txt and frontend/package.json pin, with no second pin here
  # to drift.
  - repo: local
    hooks:
      - id: backend-ruff
        name: ruff check --fix (backend)
        # The backend venv's ruff (same version as CI) when there is one, else whatever is on PATH.
        entry: bash -c 'if [ -x backend/.venv/bin/ruff ]; then RUFF=backend/.venv/bin/ruff; else RUFF=ruff; fi; $RUFF check --fix "$@"' --
        language: system
        types_or: [python, pyi]
        files: ^backend/
      - id: backend-ruff-format
        name: ruff format (backend)
        entry: bash -c 'if [ -x backend/.venv/bin/ruff ]; then RUFF=backend/.venv/bin/ruff; else RUFF=ruff; fi; $RUFF format "$@"' --
        language: system
        types_or: [python, pyi]
        files: ^backend/
      - id: frontend-eslint
        name: eslint (frontend)
        entry: bash -c 'cd frontend && npm run lint'
        language: system
        files: ^frontend/.*\.(ts|tsx)$
        pass_filenames: false
      - id: frontend-prettier
        name: prettier --check (frontend)
        entry: bash -c 'cd frontend && npm run format:check'
        language: system
        files: ^frontend/
        pass_filenames: false
      - id: docs-cross-references
        name: docs cross-references (ADR index, links and anchors, tables, AGB label)
        # Under a second; catches an ADR status line that differs from its index row, a broken anchor or
        # a table row of the wrong width before CI does.
        entry: bash -c 'cd backend && if [ -x .venv/bin/pytest ]; then PYTEST=.venv/bin/pytest; else PYTEST=pytest; fi; $PYTEST tests/test_docs.py -q --no-cov -p no:cacheprovider'
        language: system
        files: ^(docs/.*\.md|CLAUDE\.md|README\.md|SECURITY\.md|frontend/README\.md|frontend/src/legal\.ts|backend/app/domain/legal\.py)$
        pass_filenames: false
      - id: backend-mypy
        name: mypy (backend)
        # The backend venv's mypy (same version as CI) when there is one, else whatever is on PATH.
        entry: bash -c 'cd backend && if [ -x .venv/bin/mypy ]; then .venv/bin/mypy app; else mypy app; fi'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
        stages: [pre-push]
      - id: frontend-tsc
        name: tsc -b (frontend)
        entry: bash -c 'cd frontend && npx tsc -b'
        language: system
        files: ^frontend/.*\.(ts|tsx)$
        pass_filenames: false
        stages: [pre-push]
