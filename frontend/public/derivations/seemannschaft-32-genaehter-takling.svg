<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" width="780" height="380" font-family="Helvetica,Arial,sans-serif">
<defs>
<pattern id="braid" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#d6e6ee"/><line x1="0" y1="0" x2="0" y2="10" stroke="#1f6f8b" stroke-width="3" opacity="0.55"/></pattern>
<marker id="a555555" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker>
</defs>
<rect width="780" height="380" fill="#ffffff"/>
<line x1="390" y1="20" x2="390" y2="360" stroke="#dddddd"/>

<!-- left: without whipping -->
<text x="195" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">ohne Takling</text>
<path d="M40,128 L280,128 Q310,128 345,142 L345,158 Q310,172 280,172 L40,172 Z" fill="url(#braid)" stroke="#1f6f8b" stroke-width="2"/>
<rect x="40" y="139" width="200" height="22" rx="3" fill="#e0a030" stroke="#a86f10" stroke-width="1.5"/>
<line x1="235" y1="110" x2="185" y2="110" stroke="#555555" stroke-width="2" marker-end="url(#a555555)"/>
<text x="210" y="100" text-anchor="middle" font-size="13" fill="#555">Seele rutscht zurück</text>
<text x="310" y="200" text-anchor="middle" font-size="13" fill="#555">leerer Mantel</text>
<line x1="310" y1="188" x2="310" y2="170" stroke="#999" stroke-width="1"/>
<text x="195" y="250" text-anchor="middle" font-size="15" fill="#222">Seele und Mantel sind nicht</text>
<text x="195" y="270" text-anchor="middle" font-size="15" fill="#222">miteinander verbunden und</text>
<text x="195" y="290" text-anchor="middle" font-size="15" fill="#222">verschieben sich gegeneinander.</text>

<!-- right: sewn whipping -->
<text x="585" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">mit genähtem Takling</text>
<rect x="420" y="128" width="320" height="44" rx="4" fill="url(#braid)" stroke="#1f6f8b" stroke-width="2"/>
<rect x="420" y="139" width="320" height="22" rx="3" fill="#e0a030" stroke="#a86f10" stroke-width="1.5" opacity="0.85"/>
<rect x="660" y="124" width="56" height="52" rx="5" fill="#f3d5d1" stroke="#c0392b" stroke-width="1.5"/>
<g stroke="#c0392b" stroke-width="2">
<line x1="666" y1="124" x2="666" y2="176"/><line x1="672" y1="124" x2="672" y2="176"/><line x1="678" y1="124" x2="678" y2="176"/><line x1="684" y1="124" x2="684" y2="176"/><line x1="690" y1="124" x2="690" y2="176"/><line x1="696" y1="124" x2="696" y2="176"/><line x1="702" y1="124" x2="702" y2="176"/><line x1="708" y1="124" x2="708" y2="176"/>
</g>
<g stroke="#7a1f14" stroke-width="2.5" fill="none">
<line x1="660" y1="124" x2="716" y2="176"/><line x1="716" y1="124" x2="660" y2="176"/>
</g>
<text x="688" y="105" text-anchor="middle" font-size="13" fill="#555">Takling</text>
<line x1="688" y1="110" x2="688" y2="122" stroke="#999" stroke-width="1"/>
<text x="520" y="105" text-anchor="middle" font-size="13" fill="#555">Mantel</text>
<line x1="520" y1="110" x2="520" y2="128" stroke="#999" stroke-width="1"/>
<text x="520" y="200" text-anchor="middle" font-size="13" fill="#555">Seele</text>
<line x1="520" y1="188" x2="520" y2="161" stroke="#999" stroke-width="1"/>

<!-- cross-section -->
<circle cx="470" cy="300" r="34" fill="url(#braid)" stroke="#1f6f8b" stroke-width="2"/>
<circle cx="470" cy="300" r="18" fill="#e0a030" stroke="#a86f10" stroke-width="1.5"/>
<line x1="426" y1="292" x2="514" y2="308" stroke="#7a1f14" stroke-width="2.5"/>
<text x="470" y="352" text-anchor="middle" font-size="12" fill="#666">Querschnitt</text>
<text x="525" y="268" font-size="15" fill="#222">Garn eng um das Ende</text>
<text x="525" y="288" font-size="15" fill="#222">gewickelt, die Stiche gehen</text>
<text x="525" y="308" font-size="15" fill="#222">durch Mantel und Seele:</text>
<text x="525" y="328" font-size="15" fill="#222">beide sind fest verbunden.</text>
</svg>
