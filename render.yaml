databases:
  - name: sks-lotse-db
    plan: free
    region: frankfurt
    databaseName: sks_lotse
    user: sks_lotse

services:
  - name: sks-lotse-backend
    type: web
    runtime: python
    region: frankfurt
    plan: free
    rootDir: backend
    branch: main
    autoDeployTrigger: commit
    buildCommand: pip install -r requirements.txt
    # preDeployCommand isn't available on the free plan — run the
    # (idempotent) migration inline before starting the server instead.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      # Render doesn't honor backend/runtime.txt (that's a Heroku
      # convention, not a Render one) — without this it defaulted to
      # Python 3.14, which breaks SQLAlchemy 2.0.36's `X | None` type
      # introspection at import time.
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: DATABASE_URL
        fromDatabase:
          name: sks-lotse-db
          property: connectionString
      # Set manually in the Render dashboard after the first deploy —
      # not stored in this file or in git (see CLAUDE.md, Environment Variables).
      - key: JWT_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ADSENSE_CLIENT_ID
        sync: false
      - key: RESEND_API_KEY
        sync: false
      # Temporary pre-launch access gate (backend/app/core/security.py) —
      # restricts the API to whoever holds this key while the app is
      # deployed but not yet publicly launched. Remove once real auth
      # exists or the app is meant to be public.
      - key: ACCESS_GATE_KEY
        sync: false
