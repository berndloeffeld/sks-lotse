databases:
  - name: sks-lotse-db
    plan: free
    region: frankfurt
    databaseName: sks_lotse
    user: sks_lotse

services:
  - name: sks-lotse-backend
    type: web
    runtime: python
    region: frankfurt
    plan: free
    rootDir: backend
    branch: main
    autoDeployTrigger: commit
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sks-lotse-db
          property: connectionString
      # Set manually in the Render dashboard after the first deploy —
      # not stored in this file or in git (see CLAUDE.md, Environment Variables).
      - key: JWT_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ADSENSE_CLIENT_ID
        sync: false
