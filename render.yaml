databases:
  - name: sks-lotse-db
    plan: basic-256mb
    region: frankfurt
    # Pinned to what production runs, so a DB recreated from this Blueprint doesn't silently get
    # Render's current default. CI's migrations job and docker-compose.yml use the same major version.
    postgresMajorVersion: "18"
    databaseName: sks_lotse
    user: sks_lotse
    # Closed to external connections (ADR-0005 addendum, 2026-09-23) now that the admin UI
    # covers the lookups that used to need direct SQL. An empty list still allows the backend
    # and cron job to reach it over Render's internal network; only external clients (a local
    # psql) are blocked. Emergency ad hoc access: the backend service's Render Shell.
    ipAllowList: []

services:
  - name: sks-lotse-backend
    type: web
    runtime: python
    region: frankfurt
    plan: starter
    rootDir: backend
    branch: main
    # Deploy only once GitHub's checks on the commit have passed — not the moment it lands on
    # main, while CI for it may still be running (or, for a direct push, never ran).
    autoDeployTrigger: checksPass
    buildCommand: pip install -r requirements.txt
    # Runs once per deploy, before the new instance starts: a failed migration aborts the deploy
    # and the old instance keeps serving, instead of the new one crash-looping. Migrations still
    # have to be compatible with the code already running while they apply.
    preDeployCommand: alembic upgrade head
    # Exactly one worker process: the rate limiter, the catalog cache and the AI-check caps are
    # in-process memory (ADR-0007, ADR-0009) — with more workers every limit would multiply and an
    # admin change would reach only one of them. Explicit, because uvicorn otherwise takes
    # WEB_CONCURRENCY from the environment. The graceful-shutdown window lets in-flight requests and
    # background OTP mails finish before Render stops the old instance.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --timeout-graceful-shutdown 25
    # Unauthenticated, not rate-limited (see backend/app/main.py) — Render
    # only routes traffic to a new deploy once this returns 2xx.
    healthCheckPath: /health
    envVars:
      # Must match /.python-version (the single source for CI and local dev).
      # Kept explicit here rather than relying on Render picking up that file:
      # its docs only promise the repo root, and this service uses
      # rootDir: backend. Without a pinned version Render defaulted to
      # Python 3.14, which broke the SQLAlchemy pinned at the time (2.0.36):
      # its `X | None` type introspection failed at import time.
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: DATABASE_URL
        fromDatabase:
          name: sks-lotse-db
          property: connectionString
      # Not a secret — committed directly. Disables Swagger UI/ReDoc/the
      # raw OpenAPI schema (see backend/app/main.py, backend/app/core/config.py).
      - key: ENVIRONMENT
        value: production
      # One JSON object per log line: Render's log stream forwards stdout to Better Stack
      # (syslog-ng), which turns the fields into searchable, alertable columns
      # (app/core/log_config.py).
      - key: LOG_FORMAT
        value: json
      # Set manually in the Render dashboard after the first deploy —
      # not stored in this file or in git (see CLAUDE.md, Environment Variables).
      - key: JWT_SECRET
        sync: false
      - key: ANTHROPIC_GRADING_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      # Comma-separated email allowlist for a pre-launch/private beta.
      # Unset/empty = no whitelist (see backend/app/core/config.py).
      - key: ALLOWED_EMAILS
        sync: false
      # Comma-separated email allowlist for the GDPR admin tools.
      # Unset/empty = NO admins — opposite default of ALLOWED_EMAILS above
      # (see backend/app/core/config.py).
      - key: ADMIN_EMAILS
        sync: false
      # Manual maintenance-mode kill switch (docs/RUNBOOK.md → Maintenance mode).
      # sync: false so it can be flipped directly in this dashboard (the fast
      # path, redeploys on save) and survives a Blueprint Sync; the
      # maintenance-mode GitHub Action is the alternate path, calling Render's
      # API to set this same var. Unset/false = normal operation.
      - key: MAINTENANCE_MODE
        sync: false
      # Token-package checkout (ADR-0048). STRIPE_CHECKOUT is the feature flag
      # (off | admins | on; unset = off), set in the dashboard like
      # MAINTENANCE_MODE; a flip takes a redeploy. The keys and product ids are
      # the live-mode ones (docs/RUNBOOK.md → Stripe).
      - key: STRIPE_CHECKOUT
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRODUCT_TOKENS_S
        sync: false
      - key: STRIPE_PRODUCT_TOKENS_M
        sync: false
      - key: STRIPE_PRODUCT_TOKENS_L
        sync: false
      - key: STRIPE_PRODUCT_TOKENS_XL
        sync: false

  # Daily KPI mail to ADMIN_EMAILS (ADR-0032). Same code and database as the
  # backend, no HTTP. The sync: false values are entered once in the Render
  # dashboard, like the backend's.
  - name: sks-lotse-daily-report
    type: cron
    runtime: python
    region: frankfurt
    plan: starter
    schedule: "0 6 * * *"
    rootDir: backend
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: pip install -r requirements.txt
    startCommand: python -m scripts.send_daily_report
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: DATABASE_URL
        fromDatabase:
          name: sks-lotse-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: LOG_FORMAT
        value: json
      # Better Stack heartbeat URL, pinged after every fully successful run — a run that failed or
      # never started raises an alert there. Unset = no ping.
      - key: BETTERSTACK_HEARTBEAT_URL
        sync: false

  # Static site — no region/plan/startCommand/scaling fields (unsupported for
  # this service type; Render's static sites are edge-served globally, not
  # region-pinned like the compute services above). Serves
  # sks-lotse.de/www.sks-lotse.de once its Custom Domains are set in the
  # Render dashboard (a manual, account-owner step — see CLAUDE.md,
  # Deployment (Render)); sks-lotse.com stays on the backend above. See
  # ADR-0015 for why this is a separate subdomain-split service rather than
  # one origin shared with the backend.
  - name: sks-lotse-frontend
    type: web
    runtime: static
    rootDir: frontend
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      # Pinned for the same reason PYTHON_VERSION is pinned above — avoids
      # Render defaulting to a Node version newer than what CI/local dev use.
      # Must match frontend/.nvmrc (the source for CI and local dev).
      - key: NODE_VERSION
        value: "22"
      # Build-time only (Vite inlines it into the bundle) — the frontend
      # calls the API at this origin, not a relative path, since it's a
      # different subdomain from the frontend itself (see ADR-0015).
      - key: VITE_API_BASE_URL
        value: https://api.sks-lotse.de
      # Umami Cloud website id (see ADR-0016). Not a security secret — it's
      # visible to any visitor via view-source on the deployed site anyway
      # — but kept out of this committed file rather than made a
      # zero-effort grep, since the repo may go open-source. Set manually
      # in the Render dashboard (CLAUDE.md, Deployment, One-time manual
      # steps).
      - key: VITE_UMAMI_WEBSITE_ID
        sync: false
      # Google AdSense publisher id (ca-pub-…, ADR-0027). Unset = no ad
      # script is loaded at all.
      - key: VITE_ADSENSE_CLIENT_ID
        sync: false
    routes:
      # Public pages that moved from German to English paths: a permanent
      # redirect keeps bookmarks and search results working. Before the
      # rewrites, which would otherwise serve the SPA shell for them.
      - type: redirect
        source: /agb
        destination: /terms
      - type: redirect
        source: /ablauf
        destination: /exam-process
      - type: redirect
        source: /preise
        destination: /pricing
      # Prerendered public pages (ADR-0025): each path serves its own
      # prerendered file. Listed explicitly because Render doesn't map /faq
      # to faq.html on its own. Must match PAGES in scripts/prerender.mjs.
      - type: rewrite
        source: /faq
        destination: /faq.html
      - type: rewrite
        source: /imprint
        destination: /imprint.html
      - type: rewrite
        source: /privacy
        destination: /privacy.html
      - type: rewrite
        source: /terms
        destination: /terms.html
      - type: rewrite
        source: /exam-process
        destination: /exam-process.html
      # SPA fallback: routes like /login and /learn have no matching static
      # file, so a direct load/refresh still needs to serve the app and let
      # React Router take over client-side. The destination is app.html, the
      # empty shell — index.html carries the prerendered landing page
      # (ADR-0025), which must not flash up on /learn. Render only rewrites
      # paths with no matching file, so / still serves index.html.
      - type: rewrite
        source: /*
        destination: /app.html
    # Defense-in-depth headers for the HTML the learner actually interacts
    # with. The backend's SecurityHeadersMiddleware only covers
    # api.sks-lotse.de; without these, sks-lotse.de (incl. /profile's
    # "Konto löschen") could be framed by another site for clickjacking.
    headers:
      # Vite puts a content hash in every file name under /assets/, so a changed file always gets a
      # new URL — browsers may keep these forever. The HTML files that reference them keep Render's
      # default (revalidate on every load), so a deploy is picked up on the next page load.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # Enforced (ADR-0027 addendum): ran as Content-Security-Policy-Report-Only
      # first since Google's ad stack pulls in many hosts and an incomplete
      # enforced list would silently break ads or the consent dialog. Checked
      # the browser console on the live site on 2026-09-22 for "[Report Only]"
      # violations: the only one was gateway.umami.is missing from connect-src
      # (the Umami SDK's script and send-beacon endpoints are different
      # subdomains) — added below, then promoted to enforced. 'unsafe-inline'
      # for styles is needed for the style="" attributes React's prerender
      # emits. (Render sends one header per name, so this is a single
      # combined value.)
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' https://cloud.umami.is https://pagead2.googlesyndication.com https://fundingchoicesmessages.google.com https://www.googletagservices.com https://partner.googleadservices.com https://tpc.googlesyndication.com; connect-src 'self' https://api.sks-lotse.de https://cloud.umami.is https://gateway.umami.is https://pagead2.googlesyndication.com https://fundingchoicesmessages.google.com https://ep1.adtrafficquality.google https://*.g.doubleclick.net; img-src 'self' data: https://*.googlesyndication.com https://*.g.doubleclick.net https://*.google.com https://*.google.de; frame-src https://*.googlesyndication.com https://googleads.g.doubleclick.net https://fundingchoicesmessages.google.com; style-src 'self' 'unsafe-inline'; font-src 'self'; manifest-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'"
      # Legacy counterpart of frame-ancestors, for browsers that predate it.
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      # Same two-year max-age as the backend (app/core/security_headers.py).
      - path: /*
        name: Strict-Transport-Security
        value: max-age=63072000; includeSubDomains
      # Microphone stays allowed for this origin only — the planned
      # speech-to-text answer input (Web Speech API) needs it.
      - path: /*
        name: Permissions-Policy
        value: camera=(), geolocation=(), microphone=(self)
