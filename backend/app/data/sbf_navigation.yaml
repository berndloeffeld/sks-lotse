- number: 1
  situation:
  - Ein Sportboot befindet sich am 05.05.2012 in der Deutschen Bucht auf der Reise von Borkum nach Cuxhaven. Die
    Fahrt über Grund beträgt 8 kn.
  - Um 10:00 Uhr wird die Leuchttonne "TG19/Weser 2" nahebei passiert. Von dieser Tonne wird der Kurs auf die Ansteuerungstonne
    der alten Weser "ST" abgesetzt.
