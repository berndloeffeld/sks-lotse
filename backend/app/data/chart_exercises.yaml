    points: 2
    text: 'Auf dem Weg von Cuxhaven nach Spiekeroog rund um Helgoland befindet sich eine Yacht am 29.08.2013 um
      06:05 BZ (= gesetzliche Zeit) im Fahrwasser „Elbe“ bei Tonne „4“. Die Fahrt durchs Wasser (FdW) beträgt 6
      kn. Wind: E-lich 5 Bft. Man setzt von der Tonne „4“ Kurse zunächst wie folgt ab:

      – Tonne „Düne-N“ NE-lich von Helgoland (WPT 1),

      – Tonne „Sellebrunn-W“ (WPT 2),

      – Seezeichen „GB“ (WPT 3).'
