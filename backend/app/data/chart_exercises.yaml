        tolerance: Keine Toleranz
    - results:
      - text: TF = 3,4 m
        tolerance: Keine Toleranz
  - number: 2
    points: 1
    text: Vergleichen Sie die ermittelte HWH für Norderpiep „Blauort“ mit den Angaben von Büsum in den Gezeitentafeln
      im Begleitheft.
    questions:
    - points: 1
      text: Um wie viel unterscheidet sich die ermittelte Höhe von der Mittleren Springhochwasserhöhe (MSpHWH) in
        den Tabellen der Gezeitentafeln im Begleitheft?
    derivation:
    - text: HWH Norderpiep „Blauort“ − MSpHWH Büsum = 3,9 m − 4,1 m [4,07 m] = **−0,2 m** [−0,17 m]
    solution:
    - results:
      - text: An Norderpiep „Blauort“ ist die Höhe um 0,2 m [0,17 m] niedriger als der Wert für Büsum in der Tabelle
          der Gezeitentafeln.
  - number: 3
    points: 1
    text: In der Seekarte sind weite Gebiete um Büsum herum grün eingefärbt.
    questions:
    - points: 1
      text: Was bedeuten die so gefärbten Flächen in der Seekarte?
    solution:
    - results:
      - text: Trockenfallende Gebiete/Höhen/Linien über Kartennull
