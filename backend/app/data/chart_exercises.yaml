    points: 2
    text: ''
    questions:
    - points: 2
      text: Bestimmen Sie den beobachteten Ort (O_b) um 10:45 BZ.
    solution:
    - results:
      - text: 'O_b 10:45 BZ: φ = 54°04,3′ N, λ = 008°20,1′ E'
        tolerance: ± 0,2′
  - number: 14
    points: 3
    text: 'Man steuert etwas nach Steuerbord auf. Gegen 11:20 BZ erreicht man die Tonne „Süderpiep“. Ab jetzt legt
      man KaK = 085° zugrunde. Man rechnet mit folgendem Strom: StR = 050° und StG = 1,2 kn und einer Yacht-Geschwindigkeit
      von FdW = 5,8 kn. Den leichten SW-Wind berücksichtigt man mit |BW| = 2°.'
    questions:
    - points: 1
      text: 'Zeichnen Sie ein Stromdreieck (Maßstab: 1 cm entspricht 1 kn) und beschriften Sie es vollständig mit
        Bezeichnung der Vektoren, mit deren Werten und Maßeinheiten.'
    - points: 1
      text: Bestimmen Sie den Magnetkompasskurs (MgK).
    - points: 1
      text: Bestimmen Sie die Fahrt über Grund (FüG).
    derivation:
    - text: 'So entsteht das Stromdreieck: Vom Startpunkt den Stromvektor zeichnen (050°, 1,2 cm). Um seine Spitze
        einen Kreis mit dem Radius FdW = 5,8 cm schlagen. Wo der Kreis die KüG-Linie (085°) schneidet, endet der
        KdW-Vektor. Abgelesen werden KdW = 092° und FüG = 6,7 kn.'
    - text: 'Gerechnet wird wieder von unten nach oben: Der KüG = 085° ist vorgegeben, über BS, BW, Mw und Abl ergibt
        sich der MgK.'
    - text: 'BS kommt aus dem Stromdreieck: BS = KüG − KdW = 085° − 092° = −7° [± 1°, zeichnerische Toleranz].'
    - text: 'BW ist negativ, weil der Wind aus SW (ca. 225°) bei einem Kurs von etwa 090° von Steuerbord einfällt:
        Die Yacht wird nach Backbord versetzt. Bei einem Versatz nach Backbord durch Wind ist der Wert immer negativ
        zu rechnen.'
    - table:
      - cells:
        - '**MgK**'
        - '='
        - '**082°**'
      - cells:
        - Abl
        - '='
        - +11°
      - cells:
        - mwK
        - '='
        - 093°
        sum: true
      - cells:
        - Mw
        - '='
        - +1°
      - cells:
        - rwK
