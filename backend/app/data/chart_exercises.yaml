        tolerance: ± 1°
    - results:
      - text: FüG = 6,7 kn
        tolerance: ± 0,1 kn
  - number: 15
    points: 2
    text: 'Man lässt sich längere Zeit treiben und trainiert verschiedene „Mensch-über-Bord“ Manöver. Um 18:23 BZ
      zeigt das GPS folgende Koordinaten an: φ = 54°05,8‘N, λ = 008°26,8‘E. Man nimmt wieder Fahrt auf, setzt vom
      GPS-Ort weiter den KaK = 085° ab und koppelt mit FüG = 5,2 kn. Wind und Strom werden nicht berücksichtigt
      (BWS= 0).'
    questions:
    - points: 2
      text: Bestimmen Sie den Koppelort (O_k) für 19:00 BZ.
    derivation:
    - text: 'Koppelzeit von 18:23 BZ bis 19:00 BZ: 0 h 37 min = **37 min**'
    - text: d (Distanz) = FüG (Geschwindigkeit) · t (Zeit) → 5,2 kn · 37 min / 60 min = **3,2 sm**
    - text: 'Vom GPS-Ort aus 3,2 sm auf KaK = 085° abtragen: Der Endpunkt ist der Koppelort.'
    solution:
    - results:
      - text: 'O_k 19:00 BZ: φ = 54°06,1′ N, λ = 008°32,2′ E'
        tolerance: ± 0,2′
  - number: 16
    points: 3
    text: 'Um 19:00 BZ wird die Position zu einer Tonne, die auf dem Flachwassergebiet „Falsches Tief“ ein Wrack
      markiert, wie folgt ermittelt: rwP = 196°, d = 2,2 sm.'
    questions:
    - points: 2
      text: Bestimmen Sie den beobachteten Ort (O_b) um 19:00 BZ.
    - points: 1
      text: Bestimmen Sie die Besteckversetzung (BV).
    derivation:
    - text: 'O_b: Von der Wracktonne die Gegenpeilung 016° (196° − 180°) einzeichnen und darauf 2,2 sm abtragen.
        Der Endpunkt ist der beobachtete Ort.'
    - text: 'BV: Die Besteckversetzung ist der Weg vom Koppelort (O_k aus Aufgabe 15) zum beobachteten Ort (O_b).
        Richtung und Länge dieser Strecke in der Karte abgreifen.'
    solution:
    - results:
      - text: 'O_b 19:00 BZ: φ = 54°06,2′ N, λ = 008°33,5′ E'
        tolerance: ± 0,2′
    - results:
      - text: BV = 083° / 0,8 sm
        tolerance: ± 20° / ± 0,2 sm
  - number: 17
    points: 2
    text: In der Abenddämmerung identifiziert man die Befeuerung des Leuchtfeuers von Büsum.
    questions:
    - points: 2
      text: 'Beschreiben Sie das Leuchtfeuer vollständig nach Seekarte und Leuchtfeuerverzeichnis:

        – Kennung, Wiederkehr, Nenntragweite,

        – Höhe des Feuers über dem Wasser, Aussehen am Tage, Höhe des Feuerträgers über dem Erdboden.'
    solution:
    - results:
      - text: 'Kennung: Gleichtaktfeuer bzw. Isophase mit zwei weißen Sektoren und einem roten'
      - text: 'Wiederkehr: 6 s'
      - text: 'Nenntragweite: weiß 19 sm, rot 12 sm'
    - results:
      - text: 'Feuerhöhe ü. Wasser: 22 m'
      - text: 'Aussehen am Tage: rotweißer Turm'
      - text: 'Höhe FT ü. Erdboden: 22 m'
  - number: 18
    points: 1
    text: Vom O_b um 19:00 BZ soll der Hafen von Büsum möglichst auf dem kürzesten Weg angesteuert werden.
    questions:
    - points: 1
      text: Können Sie bei Niedrigwasser (NW) direkten Kurs absetzen? Begründen Sie Ihre Aussage.
    solution:
    - results:
      - text: Nein! Es gibt auf dem Kurs Gebiete, die trockenfallen.
- number: 2
  tasks:
  - number: 1
    points: 2
    text: Auf dem Weg nach Helgoland hat eine Yacht am Morgen des 12.04.2013 den Hafen von Büsum verlassen. Es herrscht
      N-Wind der Stärke 4-5 Beaufort (Bft); im Laufe des Tages zunehmend. Am Nachmittag will man bei Hochwasser
      Norderpiep „Blauort“ erreichen. Bordzeit (BZ) ist gesetzliche Zeit (GZ).
    questions:
    - points: 1
      text: Bestimmen Sie die Nachmittags-Hochwasserzeit (HWZ) für Norderpiep „Blauort“.
    - points: 1
      text: Bestimmen Sie den Tidenfall (TF) für Norderpiep „Blauort“ am Nachmittag.
    derivation:
    - text: 'Alter der Gezeit: **Springzeit (SpZ)**'
    - text: 'Norderpiep „Blauort“ ist ein Anschlussort von Büsum: Zeit und Höhe von Büsum plus die Unterschiede
        ZUG/HUG.'
    - table:
      - cells:
        - 2. HW Büsum
        - 12.04.2013
        - 14:05 MEZ
        - 4,0 m
      - cells:
        - ZUG / HUG
        - ''
        - −00:12
        - −0,1 m
      - cells:
        - '**2. HW Norderpiep „Blauort“**'
        - 12.04.2013
        - '**13:53 MEZ**'
        - '**3,9 m**'
        sum: true
    - text: 'Die Gezeitentafel ist in MEZ angegeben. Am 12.04.2013 gilt MESZ, also +1 h: 13:53 MEZ = **14:53 MESZ/BZ**.'
    - table:
      - cells:
        - 2. NWH Büsum
        - 12.04.2013
        - 0,4 m
      - cells:
        - HUG
        - ''
        - +0,1 m
      - cells:
        - '**2. NWH Norderpiep „Blauort“**'
        - 12.04.2013
        - '**0,5 m**'
        sum: true
    - text: TF = HWH − NWH = 3,9 m − 0,5 m = **3,4 m**
    solution:
