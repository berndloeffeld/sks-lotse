source: Wasserstraßen- und Schifffahrtsverwaltung des Bundes (WSV), Navigationsaufgaben SKS
hints:
- 'Erlaubte Hilfsmittel: Übungskarte 49 (INT 1463), Karte 1/INT 1, Begleitheft für die Kartenaufgaben im Fach Navigation
  für den SKS (Ausgabe 2013), Taschenrechner (nicht programmiert und nicht programmierbar), Navigationsbesteck und
  Schreibgeräte. Für die Prüfung darf die Übungskarte 49 (INT 1463) keine Eintragungen und keine Markierungen enthalten.
  Gegebenenfalls sind in die Übungskarte eingetragene Kurse, Peilungen und Orte restlos auszuradieren. Die Karte
  1/INT 1 und das Begleitheft dürfen ebenfalls keine Markierungen, zusätzlichen Eintragungen oder eingeklebten Reiter
  enthalten.'
- 'Hinweise: Die Schiffsorte sind in die Seekarte einzutragen und jeweils nach Breite und Länge anzugeben. Kurse
  und Peilungen sind ebenfalls in die Seekarte einzutragen und kaufmännisch auf volle Grade auf- bzw. abzurunden.
  Es ist die Norm DIN 13312 Navigation (soweit möglich) anzuwenden; es gilt die Steuertafel im Begleitheft. BW und
  BS (falls kein Stromdreieck zu zeichnen ist) werden als absolute Werte angegeben ( |BW| bzw. |BS| ), es ist jeweils
  das zugehörige Vorzeichen hinzuzufügen. Uhrzeiten sind in Bordzeit (BZ) anzugeben. Bei Feuern und Schifffahrtszeichen
  sind die deutschen Beschreibungen anzugeben; die Angabe von Abkürzungen reicht nicht aus. Erreichbare Punktzahl
  gesamt: 30 Punkte. Erreichbare Punktzahl je Aufgabe: Siehe entsprechende Punktvorgabe.'
- 'Gesetzliche Zeit (GZ) für 2013: MEZ bis 31.03.2013, 02:00 Uhr; dann MESZ bis 27.10.2013, 03:00 Uhr; danach MEZ.'
