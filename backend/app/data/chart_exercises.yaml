sheets:
- number: 1
  tasks:
  - number: 1
    points: 2
    text: Am 04.05.2013 liegt eine Yacht im Yachthafen von Cuxhaven. Geplant ist eine Reise elbabwärts durch die
      Norderrinne nach Büsum. Das Auslaufen soll weit vor dem Morgenhochwasser erfolgen. Bordzeit (BZ) ist gesetzliche
      Zeit (GZ). Der Tiefgang der Yacht beträgt 2,2 m.
    questions:
    - points: 1
      text: Bestimmen Sie die Hochwasserzeit (HWZ) und die Hochwasserhöhe (HWH) am Morgen.
    - points: 1
      text: Bestimmen Sie die Falldauer (FD) und den Tidenfall (TF).
    derivation:
    - text: 'Alter der Gezeit: **Nippzeit (NpZ)**'
    - table:
      - cells:
        - 1. HW Cuxhaven 04.05.2013
        - 07:53 MEZ/**08:53 MESZ**
        - '**3,2 m**'
      - cells:
        - 2. NW Cuxhaven 04.05.2013
        - 14:31 MEZ
        - 0,7 m
      - cells:
        - FD/TF Cuxhaven
        - '**06 h 38 min**'
        - '**2,5 m**'
        sum: true
    solution:
    - results:
      - text: HWZ = 08:53 MESZ/BZ
        tolerance: Keine Toleranz
      - text: HWH = 3,2 m
        tolerance: Keine Toleranz
    - results:
      - text: FD = 6 h 38 min
        tolerance: Keine Toleranz
      - text: TF = 2,5 m
        tolerance: Keine Toleranz
  - number: 2
    points: 1
    text: Die Yacht verlässt den Hafen am 04.05.2013 um 05:25 BZ noch vor Sonnenaufgang.
    questions:
    - points: 1
      text: Wie setzt dort zu dieser Zeit der Strom in Richtung (StR) und Stärke (StG) nach Seekarte?
    derivation:
    - text: '**Magentafarbene Raute „L“** der Gezeitenstromangabe'
    - text: 'HWZ Helgoland 04.05.2013: 06:40 MEZ = 07:40 MESZ/BZ'
    - text: 'Alter der Gezeit: **Nippzeit (NpZ)**'
    - text: '**05:25 BZ = 2 h 15 min vor HWZ Helgoland ≈ 2 h vor HWZ Helgoland**'
    solution:
    - results:
      - text: StR = 150°
        tolerance: Keine Toleranz
      - text: StG = 2,3 kn
        tolerance: Keine Toleranz
  - number: 3
    points: 1
    text: Vor der Tonne „14“ muss man kurzzeitig aufstoppen und treibt mit dem Strom auf die Tonne „NL 2“ zu, die
      man um 07:30 BZ erreicht.
    questions:
    - points: 1
      text: Beschreiben Sie die Tonne „NL 2“ vollständig (Kennung und Wiederkehr, Aussehen am Tage).
    solution:
    - results:
      - text: 'Kennung: Funkelfeuer bzw. Quick weiß mit Gruppe von 9 Funkeln'
      - text: 'Wiederkehr: 15 s'
      - text: 'Form: Bakentonne'
      - text: 'Farbe: gelb mit einem breiten waagerechten schwarzen Band'
      - text: 'Toppzeichen: zwei schwarze Kegel übereinander, Spitzen zueinander'
  - number: 4
    points: 2
    text: ''
    questions:
    - points: 1
      text: Welche Bedeutung hat die Tonne „NL 2“?
    - points: 1
      text: Wie kann man die Tonne „NL 2“ mit dieser Yacht passieren?
    derivation:
    - text: Der „Neue Luechtergrund“ ist zwar eine Flachwasserstelle, die Kartentiefe dort reicht aber für den Tiefgang
        der Yacht von 2,2 m aus. Deshalb kann sie die Tonne auf allen Seiten passieren.
    solution:
    - results:
      - text: 'Bedeutung: West-Kardinal-Zeichen, Tonne liegt westlich der Gefahrenstelle „Neuer Luechtergrund“ (Flachwasserstelle).'
    - results:
      - text: 'Passieren: Man kann die Tonne mit dieser Yacht gefahrlos an allen Seiten passieren.'
  - number: 5
    points: 2
    text: Die Reise fortsetzend wird von der Tonne „NL 2“ Kurs auf die Tonne „2/Außenelbe-Reede 3“ abgesetzt, was
      etwa dem Verlauf des roten Tonnenstriches entspricht.
    questions:
    - points: 1
      text: Bestimmen Sie den Kartenkurs (KaK).
    - points: 1
      text: Bestimmen Sie die Distanz (d).
    solution:
    - results:
      - text: KaK = 286°
        tolerance: ± 1°
    - results:
      - text: d = 9,7 sm
        tolerance: ± 0,2 sm
  - number: 6
    points: 1
    text: Für den Abschnitt zwischen den beiden Tonnen koppelt man mit einer durchschnittlichen Geschwindigkeit
      von FüG = 5,0 kn.
    questions:
    - points: 1
      text: Bestimmen Sie die für diese Distanz benötigte Zeit (in Stunden und Minuten).
    derivation:
    - text: 'Gegeben: Distanz d = 9,7 sm (aus Aufgabe 5) und Fahrt über Grund FüG = 5,0 kn, also 5,0 sm pro Stunde.'
    - text: t (Zeit in Stunden) = d (Distanz) / FüG (Geschwindigkeit) → 9,7 sm / 5,0 kn = 1,94 h
    - text: 'In Minuten: 1,94 h · 60 = 116,4 min ≈ 116 min'
    - text: 'In Stunden und Minuten: 116 min = 60 min + 56 min = 1 h 56 min'
    solution:
    - results:
      - text: t = 1 h 56 min
        tolerance: ± 3 min
  - number: 7
    points: 1
    text: An Tonne „NL 2“ werden die Stromverhältnisse für 07:30 BZ bestimmt.
    questions:
    - points: 1
      text: Welchen Strom nach Richtung (StR) und Stärke (StG) entnehmen Sie der Seekarte in der Nähe der Tonne
        „NL 2“?
    derivation:
    - text: '**Magentafarbene Raute „K“** der Gezeitenstromangabe'
    - text: 'HWZ Helgoland 04.05.2013: 06:40 MEZ = **07:40 MESZ/BZ**'
    - text: Alter der Gezeit = **Nippzeit (NpZ)**
    - text: '**07:30 BZ = 10 min vor HWZ Helgoland ≈ HWZ Helgoland**'
    solution:
    - results:
      - text: StR = 102°
        tolerance: Keine Toleranz
      - text: StG = 1,4 kn
        tolerance: Keine Toleranz
  - number: 8
    points: 2
    text: Man fährt dem Fahrwasser folgend weiter elbabwärts. Nach ca. zwei Stunden soll die Tonne „2/Außenelbe-Reede
      3“ erreicht werden.
    questions:
    - points: 2
      text: Mit welchem Strom nach Richtung (StR) und Stärke (StG) rechnen Sie in zwei Stunden nach Gezeitenstromatlas?
    derivation:
    - text: 'HWZ Helgoland 04.05.2013: 06:40 MEZ = **07:40 MESZ/BZ**'
    - text: Alter der Gezeit = **Nippzeit (NpZ)**
    - text: '**09:30 BZ ≈ 2 h nach HWZ Helgoland**'
    solution:
    - results:
      - text: StR = 312°
        tolerance: ± 10°
      - text: StG = 0,5 kn
        tolerance: Keine Toleranz
  - number: 9
    points: 1
    text: Bis zur Tonne „2/Außenelbe-Reede 3“ überfährt man zweimal eine in der Seekarte eingezeichnete breite grüne
      Linie.
    questions:
    - points: 1
      text: Erklären Sie die Bedeutung dieser Linie bzw. des von ihr begrenzten Gebietes.
    solution:
    - results:
      - text: Ein besonders sensibles Meeresgebiet (PSSA) mit Schifffahrtsbeschränkungen, hier „Nationalpark Schleswig-Holsteinisches
          Wattenmeer“, das in der Seekarte dargestellt und seewärts durch die breite grüne Linie mit der Beschriftung
          PSSA begrenzt wird.
  - number: 10
    points: 1
    text: Um 09:10 BZ wird die Tonne „2/Außenelbe-Reede 3“ erreicht. Etwa 2 sm südwestlich der Position ist ein
      längerer magentafarbener Pfeil in der Seekarte eingezeichnet.
    questions:
    - points: 1
      text: Erläutern Sie die Karteneintragung an dieser Stelle.
    solution:
    - results:
      - text: Festgelegte Verkehrsrichtung für das Verkehrstrennungsgebiet (VTG) „Elbe Approach“, hier westgehend.
  - number: 11
    points: 2
    text: Von der Tonne „2/Außenelbe-Reede 3“ nimmt die Yacht um 09:10 BZ Kurs auf die Tonne „Süderpiep“. Man schätzt
      den aus SSW wehenden Wind mit |BW| = 3° ein; Strom wird nicht berücksichtigt (BS = 0).
    questions:
    - points: 1
      text: Bestimmen Sie den Kartenkurs (KaK).
    - points: 1
      text: Bestimmen Sie den Magnetkompasskurs (MgK).
    derivation:
    - text: 'Gerechnet wird von unten nach oben: Der KaK wird in der Karte gemessen, daraus ergibt sich über BS,
        BW, Mw und Abl der MgK. In dieser Richtung werden die Beschickungen mit umgekehrtem Vorzeichen angebracht
        (z. B. rwK = kdW − BW = 059° − (−3°) = 062°).'
    - text: 'BW ist negativ, weil der Wind aus SSW (ca. 202°) bei einem Kurs von etwa 060° von Steuerbord einfällt:
        Die Yacht wird nach Backbord versetzt. Bei einem Versatz nach Backbord durch Wind ist der Wert immer negativ
        zu rechnen.'
    - table:
      - cells:
        - '**MgK**'
        - '='
        - '**052°**'
      - cells:
        - Abl
        - '='
        - +9°
      - cells:
        - mwK
        - '='
        - 061°
        sum: true
      - cells:
        - Mw
        - '='
        - +1°
      - cells:
        - rwK
        - '='
        - 062°
        sum: true
      - cells:
        - BW
        - '='
        - −3°
      - cells:
        - kdW
        - '='
        - 059°
        sum: true
      - cells:
        - BS
        - '='
        - 0°
      - cells:
        - '**KaK**'
        - '='
        - '**059°**'
        sum: true
    solution:
    - results:
      - text: KaK = 059°
        tolerance: ± 1°
    - results:
      - text: MgK = 052°
        tolerance: ± 1°
  - number: 12
    points: 1
    text: Gegen 10:45 BZ peilt man am Radar in der relativen Darstellungsart „Head Up“ die Tonne „Süderpiep“ nahebei
      in Radar-Seitenpeilung RaSP = 352°, anliegender MgK = 062°. Nahezu zeitgleich peilt man die westlich der Tonne
      „Süderpiep“ liegende „ODAS“-Tonne in der Magnetkompasspeilung MgP = 348°, anliegender MgK = 067°.
    questions:
    - points: 1
      text: Bestimmen Sie die rechtweisenden Peilungen (rwP).
    derivation:
    - text: 'Bei „Head Up“ ist die Radar-Seitenpeilung auf den Bug bezogen: RaSP + MgK = MgP (352° + 062° = 414°
        − 360° = 054°).'
    - text: Die Ablenkung hängt vom anliegenden Kurs ab, nicht von der Peilung. Sie wird deshalb in der Steuertafel
        für MgK = 062° (+10°) bzw. MgK = 067° (+11°) abgelesen.
    - table:
