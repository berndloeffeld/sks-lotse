- subject: wetterkunde
  number: 66
  answer_fingerprint: cffb375bbb2f
  blocks:
  - text: Wind entsteht aus Druckunterschieden. Fällt der Druck an einem Ort **schnell**, nähert sich ein **kräftiges Tief**,
      und die Isobaren davor liegen **dicht beieinander**. Je dichter sie liegen, desto stärker der Wind.
  - text: '**10 hPa in 3 Stunden** ist ein sehr steiler Fall. Er kündigt nicht nur Wind an, sondern einen **schweren Sturm**.'
  - text: An Bord misst das Barometer aber **auf einem fahrenden Schiff**. Der abgelesene Druckfall hat zwei Ursachen, das
      Tief bewegt sich und das Schiff auch.
  - text: Fährt das Schiff **auf das Tief zu**, kommt es schneller in tieferen Druck. Das Barometer fällt **stärker**, als
      es das Tief allein bewirkt. Fährt es **vom Tief weg**, fällt es **schwächer**, und die Lage wirkt harmloser, als sie
      ist. Je höher die **Fahrt**, desto größer der Unterschied.
  - text: Einordnen lässt sich der Wert also nur, wenn man weiß, wo das Tief liegt. Auf der Nordhalbkugel gilt, mit dem
      **Rücken zum Wind** liegt das Tief **links**.
  - text: Daraus folgt auch die Wahl des Kurses. Rechts der Zugbahn weht der Wind in dieselbe Richtung, in die das Tief zieht,
      dort ist er am **stärksten**. Man hält deshalb **Abstand zum Zentrum** und meidet nach Möglichkeit diese Seite.
- subject: wetterkunde
  number: 74
  answer_fingerprint: 64c332dbce55
  blocks:
  - text: Nach einer Kaltfront **dreht der Wind normalerweise nach rechts**, und der Luftdruck **steigt**. Das Wetter
      bessert sich.
  - text: Hier geschieht das **Gegenteil**. Der Wind dreht zurück, und der Druck fällt wieder. Beides sagt, dass sich
      erneut **tiefer Druck** nähert, obwohl die Front schon durch ist.
  - text: Das ist ein **Trog**, eine lang gestreckte Zone tiefen Drucks, die der Kaltfront in der kalten Luft folgt. Die
      Wetterlage heißt deshalb **Troglage**.
  - text: Der Trog bringt ähnliches Wetter wie eine weitere Front. Das Wetter wird **deutlich schlechter**, und der Wind
      **frischt erneut auf**, bis zur **Sturmstärke**.
