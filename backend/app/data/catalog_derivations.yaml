- subject: schifffahrtsrecht
  number: 79
  answer_fingerprint: d0c3b3be6507
  blocks:
  - text: Die Tonnen der Elbe sind von See her stromaufwärts gezählt. Elbabwärts fährt man **gegen die Betonnungsrichtung**.
  - text: Gegen die Betonnungsrichtung liegt die Backbordseite des Fahrwassers an Steuerbord. Die Tonne ist also eine
      **Backbordfahrwassertonne** – passend zur geraden Nummer.
  - text: 32a ist zwischen 32 und 34 eingeschoben. Elbabwärts werden die Nummern kleiner, die nächste Tonne ist **32**.
- subject: wetterkunde
  number: 25
  answer_fingerprint: 8d50276313e2
  blocks:
  - text: Die **Reibung am Boden** bremst den Wind.
  - text: Die Ablenkung nach rechts durch die Erddrehung ist umso stärker, je schneller der Wind ist. Gebremster Wind
      wird daher **weniger nach rechts abgelenkt**.
  - text: Der Zug zum Tief hin überwiegt, und der Wind **dreht zum Tief hin**.
  - text: Deshalb weht er schräg über die Isobaren, gegen den Uhrzeigersinn gedreht – er ist **rückgedreht**.
- subject: seemannschaft_allgemein
  number: 97
  answer_fingerprint: dfbda2ecad0e
  blocks:
  - text: Auf großen Schiffen liegt die Brücke oft weit achtern. Davor versperren hohe Aufbauten oder gestapelte
      Container den Blick nach unten auf das Wasser. Vor dem Bug liegt deshalb ein **toter Winkel**, in dem ein
      kleines Boot von der Brücke aus nicht zu sehen ist.
  - text: Wie groß dieser tote Winkel sein darf, ist für den Bau der Schiffe international begrenzt (SOLAS Kap. V,
      Regel 22) – auf **höchstens 2 Schiffslängen oder 500 m**, je nachdem, was kleiner ist.
  - text: Dieser Höchstwert ist das, womit Sie **mindestens rechnen** müssen. Bis zu dieser Entfernung vor dem Steven
      können Sie unsichtbar sein.
- subject: wetterkunde
  number: 93
  answer_fingerprint: 53a03b6028d1
  blocks:
  - text: Windsee macht der Wind, der gerade weht, und sie läuft mit ihm. Dünung ist Seegang, der von früherem oder
      fernem Wind stammt und weiterläuft, auch wenn sich der Wind ändert.
  - text: Dreht der Wind, baut sich eine neue Windsee aus der neuen Richtung auf. Die alte See läuft als Dünung weiter.
      **Windsee und Dünung laufen dann aus unterschiedlichen Richtungen heran**, und das ist die Kreuzsee.
  - text: Mit Kreuzsee ist also dort zu rechnen, wo der Wind schnell und stark dreht.
  - text: An einer Kaltfront und an einem Trog springt der Wind, meist nach rechts. Gefährlich ist es also **kurz vor und
      beim Durchzug einer Kaltfront oder eines Troges**.
  - text: Um den Tiefkern weht der Wind im Kreis, und die Richtung ändert sich auf engem Raum. Dort trifft See aus vielen
      Richtungen zusammen, also gibt es Kreuzsee auch **in der Nähe des Tiefkerns**.
- subject: wetterkunde
  number: 21
  answer_fingerprint: 9698628454dc
  blocks:
  - text: Luft strömt vom hohen zum tiefen Druck – also **aus dem Hoch heraus** und **in das Tief hinein**.
  - text: Durch die Erddrehung wird jede Bewegung auf der Nordhalbkugel **nach rechts abgelenkt**.
  - text: Strömt die Luft aus dem Hoch nach allen Seiten heraus und biegt dabei jeweils nach rechts ab, dreht sie
      sich insgesamt **im Uhrzeigersinn – rechtsherum** – um das Hoch.
  - text: Strömt sie von allen Seiten in das Tief hinein und biegt dabei nach rechts ab, läuft sie am Kern vorbei
      und kreist **gegen den Uhrzeigersinn – linksherum** – hinein.
  - image:
      src: wetterkunde-21-wind-um-hoch-und-tief.svg
      width: 780
      height: 400
      alt: Skizze zweier Druckgebilde auf der Nordhalbkugel. Links ein Hoch, aus dessen Mitte die Pfeile im
        Uhrzeigersinn nach außen laufen. Rechts ein Tief, in dessen Mitte die Pfeile gegen den Uhrzeigersinn
        hineinlaufen. Alle Pfeile kreuzen die kreisförmigen Isobaren schräg.
  - text: In Bodennähe bremst die Reibung den Wind. Er weht deshalb nicht genau um die Druckgebilde herum, sondern
      spiralförmig **heraus bzw. hinein**.
- subject: wetterkunde
  number: 54
  answer_fingerprint: 34607d0d23cf
  blocks:
  - text: Normalerweise liegen Böen nur etwa 1 bis 2 Bft über dem vorhergesagten Mittelwind, auch Schauerböen
      meist nicht mehr als 2 Bft. Wer die Vorhersage liest, rechnet also mit **wenig mehr als dem Mittelwind**.
  - text: Im Sommer heizt die Sonne Land und bodennahe Luft stark auf. Warme, feuchte Luft steigt rasch hoch, und es
      bilden sich Gewitterwolken – auch dann, wenn das Druckgefälle der Wetterlage nur **schwachen Wind** bringt.
  - text: Aus der Gewitterwolke stürzt mit dem Niederschlag kalte Luft herab und breitet sich am Boden nach allen
      Seiten aus. Diese Böe hängt nicht von der Wetterlage ab, sondern vom Gewitter selbst, und kann **Sturm- oder
      Orkanstärke** erreichen.
  - text: Aus dem schwachen Mittelwind der Vorhersage ist sie also nicht abzulesen. Deshalb werden Gewitterböen
      **zusätzlich angegeben**.
- subject: wetterkunde
  number: 56
  answer_fingerprint: 52663a320992
  blocks:
  - text: Der Seewetterbericht gilt für ein großes Seegebiet. Er beruht auf dem **großräumigen Windfeld** der Wetterlage,
      also auf Druckverteilung und Fronten. Was sich nur auf wenigen Seemeilen an der Küste abspielt, steckt darin
      nicht.
  - text: Tagsüber erwärmt sich das Land schneller als das Wasser. Die warme Luft steigt über Land auf, und von See
      strömt kühlere Luft nach – der **Seewind**. Nachts kühlt das Land schneller aus, und die Strömung kehrt sich um –
      der **Landwind**.
  - text: Zwischen zwei Landmassen oder in einer Meerenge muss dieselbe Luftmenge durch einen engeren Querschnitt. Sie
      wird zusammengedrängt und strömt **schneller** – der **Düseneffekt**.
  - text: Eine vorspringende Landzunge, ein **Kap**, zwingt den Wind, um sie herumzuströmen. Auch dort rücken die
      Stromlinien zusammen, und der Wind weht stärker als in der Umgebung – der **Kapeffekt**.
  - text: Diese Effekte sind **kleinräumig** und hängen von Küstenform und Tageszeit ab. Ein Bericht für das ganze
      Seegebiet kann sie nur eingeschränkt berücksichtigen. Vor Ort muss man damit zusätzlich rechnen.
- subject: seemannschaft_allgemein
  number: 96
  answer_fingerprint: 2bb75954c614
  blocks:
  - text: Ein großes Schiff hat eine riesige Masse, und bei 20 kn steckt darin viel Schwung in Fahrtrichtung. Das Ruder
      kann diesen Schwung nicht abbremsen, es kann das Schiff nur **langsam in eine andere Richtung zwingen**.
  - text: Das Ruder sitzt am Heck und drückt dieses zur Seite. Das Schiff dreht sich dadurch um einen Punkt im vorderen
      Drittel. Der **Steven bewegt sich in Richtung der Hartruderlage**, das **Heck schlägt zur Gegenseite aus**.
  - text: Das Schiff dreht sich also zuerst nur um sich selbst, und der Rumpf schiebt dabei weiter in der alten Richtung
      voraus. Der Drehpunkt bleibt noch auf der alten Kurslinie.
  - image:
      src: seemannschaft-96-hartruder-ausweichen.svg
      width: 780
      height: 330
      alt: Draufsicht auf ein Schiff, das nach rechts fährt, zu vier Zeitpunkten. Das Ruder liegt hart Steuerbord. Das
        Schiff dreht sich zunehmend nach rechts, der Bug wandert nach unten, das Heck schlägt nach oben aus. Der
        Drehpunkt bleibt zuerst auf der gestrichelten alten Kurslinie. Eine Klammer markiert 1,5 bis 2,5
        Schiffslängen, in denen das Schiff noch in der alten Richtung weiterläuft.
  - text: Erst nach **mehreren Schiffslängen** hat sich das Schiff so weit gedreht, dass es seitlich von der alten
      Kurslinie wegläuft. Bei einem 300 m langen Containerschiff sind das **1,5 bis 2,5 Schiffslängen**, also etwa
      500 bis 600 m.
  - text: Ein Ausweichmanöver muss deshalb **früh** eingeleitet werden. Hartruder allein schafft auf kurze Distanz keinen
      Abstand.
- subject: seemannschaft_allgemein
  number: 88
  answer_fingerprint: e9a9721b52f6
  blocks:
  - text: Die Haltekraft ist die Kraft, die ein Anker im Grund hält. Anker mit **hoher Haltekraft** halten im
      Verhältnis zu ihrem Gewicht besonders viel, weil sie sich beim Zug **in den Grund eingraben**. Der
      Germanische Lloyd erkennt vier Bauarten als solche an, und gefragt sind drei davon.
  - image:
      src: seemannschaft-88-anker-mit-hoher-haltekraft.svg
      width: 780
      height: 290
      alt: Skizze von vier Ankern nebeneinander. Der Bruce-Anker hat einen langen Schaft mit Auge, einen Knick und
        eine Klaue mit zwei Spitzen. Der CQR-Anker hat einen Schaft mit Gelenk und darunter eine Pflugschar. Der
        Danforth-Anker hat einen langen Schaft, am Ende einen Stock und zwei flache Flunken, die zum Auge zeigen.
        Der D'Hone-Anker hat eine breite flache Platte, zwei Streben und einen senkrechten Schaft mit Auge.
  - text: Zum Merken hilft die Form. **Bruce** hat eine Klaue, **CQR** eine Pflugschar mit Gelenk, **Danforth** zwei
      Flunken mit Stock und **D'Hone** eine Platte mit Streben.
- subject: wetterkunde
  number: 27
  answer_fingerprint: 0ae1f147e899
  blocks:
  - text: Ohne Reibung weht der Wind parallel zu den Isobaren, um das Hoch herum im Uhrzeigersinn. In Bodennähe bremst die
      **Reibung** den Wind, auch über See. Gebremster Wind wird weniger nach rechts abgelenkt, und der Druckunterschied
      zieht ihn zum tiefen Druck hin.
  - text: Beim Hoch liegt der tiefe Druck außen. Der Wind kreuzt die Isobaren deshalb nach außen, er weht **aus dem Hoch
      heraus**. Gegenüber der Richtung der Isobaren ist er **rückgedreht**.
  - image:
      src: wetterkunde-27-wind-um-das-hoch.svg
      width: 780
      height: 350
      alt: Draufsicht auf ein Hoch mit drei kreisförmigen Isobaren. An sechs Punkten der mittleren Isobare zeigt ein
        grauer gestrichelter Pfeil parallel zur Isobare im Uhrzeigersinn. Daneben zeigt ein roter Pfeil, der Wind in
        Bodennähe, etwa 10 bis 20 Grad nach außen aus dem Hoch heraus.
  - text: Als Faustwert gelten über See **10° bis 20°**. Das sind **ein bis zwei Strich**, denn ein Strich der Kompassrose
      sind 11,25°.
- subject: schifffahrtsrecht
  number: 41
  answer_fingerprint: 55c5083dcde3
  blocks:
  - text: Rot-weiß-rot senkrecht übereinander ist das Zeichen für ein **manövrierbehindertes Fahrzeug**.
  - text: Dazu zeigt es Topplichter und Seitenlichter. Die gibt es nur, wenn es **Fahrt durchs Wasser** macht (FdW). Ein
      manövrierbehindertes Fahrzeug ohne Fahrt zeigt sie nicht.
  - text: Ein manövrierbehindertes Fahrzeug hat sonst Vorrang vor einem Segelfahrzeug. Das gilt aber nicht, wenn es
      **von hinten heranläuft**, denn dann gilt die Überholregel.
  - text: Wer ein anderes Fahrzeug aus einer Richtung **mehr als 22,5° achterlicher als querab** einholt, ist Überholer.
      Das ist der **Hecklichtsektor**, der Bereich, in dem man nachts nur das weiße Hecklicht sehen würde.
  - text: Das Fahrzeug kommt nahezu achteraus näher, also aus diesem Sektor. Es ist **Überholer und muss ausweichen**.
- subject: schifffahrtsrecht
  number: 39
  answer_fingerprint: d8388a363069
  blocks:
  - text: Ein **grünes Licht** ist das Seitenlicht an Steuerbord. Man sieht es, wenn man dem anderen Fahrzeug auf seine
      Steuerbordseite schaut. Ein Segelfahrzeug in Fahrt zeigt nur Seitenlichter und Hecklicht, also ist es das
      **Steuerbordlicht eines Segelfahrzeugs in Fahrt**.
  - text: Zwei Segler mit Wind von verschiedenen Seiten – das Fahrzeug mit Wind von **Backbord weicht aus**. Mit Wind von
      derselben Seite weicht das **luvwärtige** aus.
  - text: Nachts sieht man nur das Seitenlicht, nicht das Segel. **Von welcher Seite das andere den Wind hat, ist nicht
      zu erkennen.**
  - text: Hat es Wind von Steuerbord, müssen Sie als Backbordwind-Fahrzeug ausweichen. Hat es Wind von Backbord, wäre es als
      Luvfahrzeug ausweichpflichtig. Sie können die beiden Fälle nicht unterscheiden.
  - text: Für diesen Zweifel gilt – wer Wind von Backbord hat, ein Fahrzeug in Luv sieht und **nicht erkennen kann**,
      von welcher Seite es den Wind hat, **weicht aus**. Sie gelten dann als leewärtiges Fahrzeug.
- subject: schifffahrtsrecht
  number: 18
  answer_fingerprint: edf15926ef43
  blocks:
  - text: Zwei Fahrzeuge, die in **gleichbleibendem Abstand** hintereinander fahren, hängen zusammen. Das ist ein
      **Schleppverband** aus Schlepper und Anhang.
  - text: Am Tage zeigt ein Schleppverband einen **schwarzen Rhombus**, wenn er **länger als 200 m** ist. Er steht auf
      dem Schlepper und auf dem Anhang. Gemessen wird vom Heck des Schleppers bis zum Heck des Anhangs.
  - text: Dass die einzelnen Fahrzeuge kürzer als 50 m aussehen, spielt keine Rolle. Die Länge des **ganzen Verbands**
      zählt.
  - text: Ein Verband bis 200 m zeigt am Tage **kein besonderes Sichtzeichen**. Der Rhombus ist also gerade das Zeichen
      für **länger als 200 m**.
  - text: Der Schlepper führt nachts **drei weiße Topplichter** senkrecht übereinander, weil der Verband länger als 200 m
      ist. Mit weniger als 200 m wären es zwei. Dazu kommen **Seitenlichter** und das **Hecklicht**.
  - text: Über dem Hecklicht zeigt der Schlepper das **gelbe Schlepplicht**. Es sagt, dass er etwas hinter sich herzieht.
  - text: Der Anhang führt nur **Seitenlichter und Hecklicht**. Er hat weder Topplichter noch ein Schlepplicht.
- subject: schifffahrtsrecht
  number: 14
  answer_fingerprint: 6d7f5a22e719
  blocks:
  - text: Das Zeichen für ein manövrierbehindertes Fahrzeug ist **rot-weiß-rot senkrecht übereinander**. Es steht in
      **allen drei Fällen**, denn es sagt nur, dass das Fahrzeug nicht ausweichen kann.
  - text: Die übrigen Lichter zeigen, **was das Fahrzeug gerade tut**. Ohne Fahrt durchs Wasser (FdW) ist es das Zeichen
      allein, denn ein Fahrzeug, das sich nicht bewegt, zeigt keine Fahrtlichter.
  - text: Mit FdW kommen die Lichter eines **Maschinenfahrzeugs in Fahrt** dazu – **Topplicht(er)**, **Seitenlichter** und
      **Hecklicht**.
  - text: Vor Anker liegt es still. Statt der Fahrtlichter zeigt es **Ankerlicht(er)**.
- subject: schifffahrtsrecht
  number: 21
  answer_fingerprint: eb81285db31b
  blocks:
  - text: '**Rot über weiß** senkrecht übereinander, beide rundum sichtbar, ist das Zeichen eines **Fischers**. Ein Fischer,
      der **trawlt**, zeigt dagegen grün über weiß.'
  - text: Hier ist es rot über weiß, also ein Fischer, der **nicht trawlt**. Mit Netzen, die treiben, ist das der
      **Treibnetzfischer**.
  - text: Das **zusätzliche weiße Licht** darunter, seitlich versetzt, zeigt in die Richtung, in der das Fanggerät liegt.
      Es wird nur geführt, wenn das Gerät **waagerecht mehr als 150 m** ins Wasser reicht.
  - text: In Fahrt kommen Seitenlichter und Hecklicht dazu. Deshalb kann das untere weiße Licht auch das **Hecklicht**
      sein. Vor Anker mit ausgebrachtem Gerät zeigt der Fischer dasselbe Bild.
  - text: Bei **unsichtigem Wetter** gibt ein Fischer ein Schallsignal, das **lang-kurz-kurz** heißt, **mindestens alle
      2 Minuten**. Es ersetzt das Signal der Maschinenfahrzeuge. Vor Anker gibt der Fischer es ebenfalls, statt des
      Ankersignals.
- subject: schifffahrtsrecht
  number: 38
  answer_fingerprint: 496a5b14c380
  blocks:
  - text: Ein **rotes Licht** ist das **Seitenlicht an Backbord**. Man sieht es, wenn man dem anderen Fahrzeug auf seine
      Backbordseite schaut. Ein einzelnes Seitenlicht hat ein Fahrzeug in Fahrt, das nur Seitenlichter und Hecklicht
      zeigt, also hier ein **Segelfahrzeug in Fahrt**.
  - text: Das andere Fahrzeug kommt **in stehender Peilung** näher. Es besteht **Kollisionsgefahr**, und es steht in **Luv**
      von Ihnen.
  - text: Nachts sieht man nur das Seitenlicht, nicht das Segel. **Von welcher Seite das andere den Wind hat, ist nicht
      zu erkennen.** Beide Fälle führen aber zum selben Ergebnis.
  - text: Hat es den Wind von **Backbord**, muss es als Fahrzeug mit Wind von Backbord **ausweichen**. Sie haben den Wind
      von der anderen Seite.
  - text: Hat es den Wind von **Steuerbord**, haben beide den Wind von derselben Seite. Dann weicht das **luvwärtige**
      Fahrzeug aus, und das ist das andere.
  - text: In beiden Fällen weicht also das **Segelfahrzeug in Luv** aus. Sie müssen kein Licht deuten, das Sie nicht
      sicher erkennen können, und sind **Kurshalter**.
- subject: schifffahrtsrecht
  number: 34
  answer_fingerprint: bca27bbb8875
  blocks:
  - text: Ein betonnter Schifffahrtsweg ist **kein Verkehrstrennungsgebiet**. Für ihn gibt es keine eigene Querungsregel
      und **keine pauschale Vorfahrt** für die Schiffe, die ihm folgen.
  - text: Wer ihn quert, begegnet den Schiffen darauf wie jedem anderen Fahrzeug. Es gelten die **allgemeinen
      Ausweichregeln der KVR**. Bei kreuzenden Maschinenfahrzeugen weicht aus, wer das andere an **Steuerbord** hat.
      Dazu kommt die **Rangfolge** der Fahrzeuge, etwa Maschinenfahrzeug vor Segelfahrzeug.
  - text: Dazu gehört, dass Sie in einem **engen Fahrwasser** ein Fahrzeug nicht behindern, das nur dort sicher fahren
      kann. Und wer ausweichen muss, tut es **frühzeitig und deutlich**.
- subject: seemannschaft_allgemein
  number: 28
  answer_fingerprint: fc397053e0b5
  blocks:
  - text: "Leistung ist Spannung mal Strom (Watt = Volt × Ampere). Umgekehrt ist der Strom die Leistung geteilt durch
      die Spannung. Ein Verbraucher mit 24 W an 12 V zieht also 24 : 12 = **2 A**."
  - text: Zwei solche Verbraucher ziehen zusammen 2 × 2 A = **4 A**.
  - text: Die Strommenge in Amperestunden ist Strom mal Zeit. In 10 Stunden sind das 4 A × 10 h = **40 Ah**.
- subject: seemannschaft_allgemein
  number: 29
  answer_fingerprint: 52d108fc18ad
  blocks:
  - text: An Festmacherleine, Ankertrosse und Schlepptrosse hängt das ganze Gewicht des Bootes, gezogen von Wind,
      Strom und Seegang. Die Leine darf unter dieser Last nicht reißen, sie muss also **bruchfest** sein.
  - text: Wellen und Schwell reißen das Boot immer wieder ruckartig ein Stück weg. Eine starre Leine gibt jeden
      Ruck voll an Klampen, Beschläge und Anker weiter. Eine Leine, die sich etwas dehnt, federt ihn ab – sie
      muss also **elastisch** sein.
- subject: seemannschaft_allgemein
  number: 32
  answer_fingerprint: 3ca0b36ab772
  blocks:
  - text: Bei solchem Tauwerk sind innen und außen zwei getrennte Teile – innen die Seele, die die Last trägt, außen
      der geflochtene Mantel, der sie schützt. Sie sind nicht miteinander verbunden. Unter Last dehnen sie sich
      verschieden stark, verschieben sich gegeneinander, und am Ende **rutscht die Seele in den Mantel**.
  - text: Damit das nicht passiert, müssen Seele und Mantel am Ende **fest miteinander verbunden** werden.
  - text: Ein **Takling** ist eine enge Umwicklung des Tauwerkendes mit dünnem Garn (Takelgarn). Er hält das Ende
      zusammen, damit es nicht aufgeht oder ausfranst. Einfach gewickelt drückt er aber nur von außen auf den Mantel.
  - text: Beim **genähten Takling** wird das Garn zusätzlich mit einer Nadel quer durch das Tauwerk gestochen. Die
      Stiche gehen durch Mantel und Seele und halten **beide fest zusammen**.
  - image:
      src: seemannschaft-32-genaehter-takling.svg
      width: 780
      height: 380
      alt: Skizze zweier Tauwerkenden mit Mantel und Seele. Links ohne Takling, die Seele ist ein Stück in den Mantel
        zurückgerutscht, das Ende des Mantels ist leer. Rechts mit genähtem Takling, das Ende ist mit Garn umwickelt
        und vernäht; ein Querschnitt zeigt, dass der Stich durch Mantel und Seele geht.
- subject: seemannschaft_allgemein
  number: 3
  answer_fingerprint: 38fe46fac421
  blocks:
  - text: Bei der Massivbauweise ist die Rumpfwand durchgehend aus GFK. Bei der Sandwichbauweise liegen außen und innen
      je eine dünne GFK-Schicht, dazwischen ein leichter Kern, etwa aus Schaumstoff oder Balsaholz.
  - text: Biegt man eine Wand, wird die eine Seite gestaucht und die andere gedehnt, die Mitte trägt kaum etwas bei. Der
      Kern hält die beiden GFK-Schichten auf Abstand, sie sitzen also genau dort, wo die Last am größten ist. Das
      ergibt **große Steifheit**.
  - image:
      src: seemannschaft-3-sandwichbauweise.svg
      width: 780
      height: 340
      alt: Skizze zweier belasteter Rumpfwände im Querschnitt, oben jeweils gestaucht, unten gedehnt. Links massiv,
        durchgehend aus GFK, die Wand biegt sich stärker. Rechts Sandwich, zwei dünne GFK-Schichten mit einem leichten
        Kern dazwischen, die Wand biegt sich weniger.
  - text: Dasselbe gilt, wenn der Rumpf verdreht wird, auch das nehmen die weit außen liegenden Schichten auf. Das ist
      die **Verwindungsfestigkeit**.
  - text: Der Kern wiegt viel weniger als das GFK, das er ersetzt. Für dieselbe Steifheit bleibt das **Gewicht gering**.
  - text: Schaumstoff und Balsaholz leiten Wärme schlecht, anders als massives GFK. Das ergibt eine **gute Isolierung**.
- subject: seemannschaft_allgemein
  number: 8
  answer_fingerprint: 62457873a3c5
  blocks:
  - text: Das Ruder sitzt weit achtern, das Steuerrad meist weiter vorn auf der Steuersäule. Die Drehung des Rades muss
      also **bis zum Ruder** gelangen.
  - text: Das Rad dreht auf seiner Achse ein **Zahnrad**. Darüber läuft eine **Kette**, deren beide Enden in der
      Steuersäule nach unten hängen. Dreht man das Rad, geht die eine Seite hoch und die andere herunter.
  - text: Eine Kette taugt nicht für den langen Weg durch das Boot. Unten sind ihre Enden deshalb mit den
      **Steuerseilen** verbunden.
  - text: Die Seile müssen von der Säule nach achtern und dafür um die Ecke. Das erledigen die **Umlenkrollen**.
  - text: Achtern enden sie am **Ruderquadranten**, einem Kreisbogen auf dem Ruderschaft. Zieht das eine Seil, gibt das
      andere nach, der Quadrant dreht sich und mit ihm das Ruder.
  - image:
      src: seemannschaft-8-radsteuerung.svg
      width: 780
      height: 640
      alt: Schema einer Radsteuerung. Das Steuerrad dreht ein Zahnrad, über das eine Kette in der Steuersäule nach unten
        läuft. An den Kettenenden hängen zwei Steuerseile. Sie laufen am Fuß der Säule über je eine Umlenkrolle schräg
        zu beiden Seiten, über je eine weitere Umlenkrolle zurück und enden am Ruderquadranten auf dem Ruderschaft.
