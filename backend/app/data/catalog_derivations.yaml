- subject: seemannschaft_allgemein
  number: 22
  answer_fingerprint: 0a72cd87b332
  blocks:
  - text: Der Motor dreht immer in dieselbe Richtung und läuft auch, wenn das Boot stillliegen soll. Der Propeller soll
      dagegen mal stehen, mal vorwärts und mal rückwärts drehen. Das Wendegetriebe sitzt dazwischen und gleicht das aus.
  - text: Damit das Boot bei laufendem Motor nicht fährt, trennt das Getriebe den Propeller vom Motor und verbindet ihn
      bei Bedarf wieder. Es dient also zum **Ein- und Auskuppeln des Propellers**.
  - text: Für die Rückwärtsfahrt muss der Propeller andersherum drehen, der Motor kann das nicht. Das Getriebe kehrt die
      Drehrichtung um, also **zum Umsteuern auf Rückwärtsfahrt**.
  - text: Der Motor dreht außerdem schneller, als der Propeller wirksam arbeiten kann. Das Getriebe setzt die Drehzahl
      herab, das ist die **Drehzahluntersetzung**.
- subject: seemannschaft_allgemein
  number: 27
  answer_fingerprint: ecc52ae18c9e
  blocks:
  - text: "\"2 x 60 Ah\" heißt zwei Batterien mit je 60 Ah. Zusammen sind das 2 × 60 Ah = **120 Ah Nennkapazität**."
  - text: Geladen wird ein Akku kaum über 80 % seiner Nennkapazität. Mehr als 120 Ah × 0,8 = **96 Ah** sind also nicht
      drin.
  - text: Ganz leeren darf man ihn aber auch nicht, denn Tiefentladung schadet ihm. Rund 20 % sollten drinbleiben, das
      sind 120 Ah × 0,2 = **24 Ah**.
  - text: Nutzbar ist nur, was dazwischen liegt. 96 Ah − 24 Ah = **etwa 72 Ah** Nettokapazität.
- subject: schifffahrtsrecht
  number: 46
  answer_fingerprint: 73275e0371bb
  blocks:
  - text: Ein **Behinderungsverbot** trifft die kleinen und wendigen Fahrzeuge. Gemeint sind Fahrzeuge **unter 20 m** und
      **Segelfahrzeuge**. Sie dürfen größere Fahrzeuge nicht behindern, die wenig Raum zum Ausweichen haben.
  - text: Das gilt zum einen in **engen Fahrwassern**, gegenüber Fahrzeugen, die nur dort sicher fahren können. Das hatten
      Sie genannt.
  - text: Es gilt zum anderen auf dem **Einbahnweg eines Verkehrstrennungsgebiets (VTG)**. Dort darf ein Fahrzeug unter
      20 m oder ein Segelfahrzeug die sichere Durchfahrt der **Maschinenfahrzeuge** nicht behindern, die dem Einbahnweg
      folgen.
- subject: seemannschaft_segeln
  number: 25
  answer_fingerprint: ca65ed748e83
  blocks:
  - text: Fallen, Schoten und Festmacher sind **im Alltag gefahrenes Tauwerk**. Gefragt ist, was darüber hinaus **für den
      Notfall** an Bord sein sollte. Jede der vier Leinen hat dafür einen eigenen Zweck.
  - text: Das **Reservetauwerk** ersetzt, was bricht, scheuert oder über Bord geht, etwa eine Schot oder einen Festmacher.
      Ohne Ersatz ist das Boot dann nicht mehr voll zu bedienen.
  - text: Die **Wurfleine** ist eine dünne, leichte Leine, oft mit einem Gewicht am Ende. Man wirft sie weit, um **eine
      Verbindung herzustellen**, zum Beispiel zu einem Menschen im Wasser, zu einem anderen Boot oder zum Steg. Daran
      zieht man dann eine dickere Leine hinüber.
  - text: Die **Schlepptrosse** ist **lang und stark**. Mit ihr nimmt man ein anderes Fahrzeug in Schlepp oder wird selbst
      geschleppt. Sie hält die Last, die eine gewöhnliche Leine nicht tragen würde.
  - text: Die **Ankerleine** hält das Boot am Anker. Sie ist lang genug für die Wassertiefe und reißt nicht. Damit lässt
      sich auch ein Boot festmachen, wenn kein Steg da ist. In der Not ist der Anker die Bremse.
