# Reviewed Seemannschaft I/II duplicate pairs, merged into seemannschaft_allgemein by
# app/services/catalog_seed.py (merge_seemannschaft), in the Seemannschaft I wording for
# both exam variants. Proposed by scripts/merge_seemannschaft.py, reviewed by hand.
#
# A pair whose question or answer isn't word-for-word identical (whitespace-normalized) must
# carry `accepted_difference`, or the merge refuses to run: Motor learners would otherwise
# see wording that isn't in their official catalog. List those pairs with
# scripts/diff_seemannschaft_pairs.py. A difference is accepted only when it is editorial
# (synonym, word order, punctuation, spelling), so that a learner who knows either version
# answers the other correctly. See docs/adr/0026-merge-seemannschaft-only-on-matching-wording.md.
#
# Deliberately NOT merged (reviewed 2026-09-19, content differs, so each variant keeps its
# own official text as seemannschaft_segeln/_motor):
#   S I #22  / S II #14:  S II's answer lacks "und eine unter Deck" bedienbare Bilgenpumpe
#   S I #25  / S II #17:  Yacht + "Fallen und Schoten" vs. Motoryacht
#   S I #55  / S II #45:  Tanken von Diesel (3 measures) vs. Tanken und Umfüllen von
#                         Brennstoffen (5 measures)
#   S I #58  / S II #46:  eingebauter Motor vs. Dieselmotor, S II has a 4th measure
#   S I #107 / S II #87:  "kreuzen ... auf" vs. "fahren"
#   S I #109 / S II #90:  S I adds Großschot, Unterfangen mit Segel, Dingi
#   S I #124 / S II #105: S I adds Zahl und Zustand der Segel, UKW-Seefunkanlage
#   S I #157 / S II #140: S I adds a 5th item (Windabdeckung)
# (#55/#58 were hand-paired in the original review: the greedy proposal matched #55 to
# S II #46 and #58 to #47. S II #47, Benzinmotor, has no counterpart in S I.)
