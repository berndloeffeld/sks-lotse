# SKS catalog sub-topics. Originally transcribed verbatim from the table of contents on pages
# 1-3 of docs/Fragenkatalog-SKS.pdf (issued by the Bundesministerium für Verkehr, Bau und
# Stadtentwicklung together with the WSV, DMYV and DSV). Several of the official TOC entries have
# since been merged or split into new, short collective names — done deliberately to keep every
# topic's question count between 10 and 35 for a usable per-topic learning UI (many official
# entries had far fewer questions, some far more); see ADR-0020. This is the one place in the
# catalog pipeline where a name is *not* a verbatim TOC heading — everything else in this file's
# header comment below (Seemannschaft I/II merge, "never invents topics" for manage_topics.py)
# still holds.
#
# The official Seemannschaft I (18 topics) and Seemannschaft II (16 topics) lists are identical
# except for 3 entries; those 3 are what separates the two exam variants (see
# backend/scripts/merge_seemannschaft.py). seemannschaft_segeln below is I's own list (now
# merged/grouped, see ADR-0020) verbatim as a subset of I's 163 original questions;
# seemannschaft_motor is II's own list (same reasoning); seemannschaft_allgemein covers the
# topics common to both lists (Takelung/Segel/Segelstellung and Stabilität-Trimm never apply to a
# question proven word-for-word identical across both variants). A shared slug therefore exists as
# a separate row (own id) per subject, same as every other subject in this file — not a single row
# reused across subjects.
#
# manage_topics.py reads this file; it never invents or renames topics on its own — only this
# file (human-edited) does.

