# Official SKS catalog sub-topics, transcribed verbatim from the table of contents on pages 1-3
# of docs/Fragenkatalog-SKS.pdf (issued by the Bundesministerium für Verkehr, Bau und
# Stadtentwicklung together with the WSV, DMYV and DSV) — not invented, not LLM-generated.
#
# The official Seemannschaft I (18 topics) and Seemannschaft II (16 topics) lists are identical
# except for 3 entries; those 3 are what separates the two exam variants (see
# backend/scripts/merge_seemannschaft.py). seemannschaft_segeln below is I's own 18-topic list
# verbatim (its rows are a genuine subset of I's 163 original questions); seemannschaft_motor is
# II's own 16-topic list verbatim (same reasoning); seemannschaft_allgemein gets only the 15
# topics common to both lists (Takelung/Segel/Segelstellung and Stabilität-Trimm never apply to a
# question proven word-for-word identical across both variants). A shared topic name therefore
# exists as a separate row (own id) per subject, same as every other subject in this file — not a
# single row reused across subjects.
#
# manage_topics.py reads this file; it never invents or renames topics itself.

